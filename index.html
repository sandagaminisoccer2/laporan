<style>
:root{
  --teal-950:#0c3a35;
  --teal-800:#0f4c46;
  --teal-700:#146258;
  --teal-600:#1a7566;
  --cream-50:#fbf5e4;
  --cream-100:#f3e6bf;
  --rust-600:#c1442d;
  --rust-700:#a3371f;
  --gold-500:#dba43c;
  --gold-600:#c28f2c;
  --gold-100:#faedcd;
  --ink-900:#1b2a26;
  --ink-600:#54655f;
  --white:#fffdf7;
  --line:#e4d5ab;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --pill-h:54px; --pill-gap:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Poppins',sans-serif;
  background:var(--cream-50);
  color:var(--ink-900);
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
.display{font-family:'Bebas Neue',cursive;letter-spacing:0.5px;}

/* ===== TOPBAR (pil melayang, sama seperti menu kedai) ===== */
.topbar{
  position:sticky; top:calc(var(--pill-gap) + var(--safe-top)); z-index:40;
  height:var(--pill-h);
  margin:calc(var(--pill-gap) + var(--safe-top)) 12px 0;
  display:flex; align-items:center; justify-content:center; gap:11px;
  background:rgba(12,58,53,0.96);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  border:1px solid rgba(219,164,60,0.35);
  border-radius:22px; padding:0 16px;
  box-shadow:0 14px 30px -10px rgba(12,58,53,0.6);
}
.topbar img{
  width:36px; height:36px; border-radius:50%;
  border:2px solid var(--gold-500);
  object-fit:cover; background:var(--cream-100); flex-shrink:0;
}
.topbar .eyebrow{font-size:9.5px; letter-spacing:2px; color:var(--gold-500); font-weight:600; line-height:1.2;}
.topbar .brand{font-size:15px; font-weight:700; color:var(--cream-50); line-height:1.2; white-space:nowrap;}

/* ===== GRADASI atas & bawah ===== */
:root{
  --fade-over:80px; --fade-over-bot:5px; --fade-ease:20px;
  --fade-solid-top:calc(var(--pill-gap) + var(--safe-top) + var(--pill-h) + 2px);
  --fade-solid-bot:calc(12px + var(--safe-bottom) + 58px + 2px);
}
body::before, body::after{content:''; position:fixed; left:0; right:0; z-index:25; pointer-events:none;}
body::before{
  top:calc(-1 * var(--fade-over));
  height:calc(var(--fade-over) + var(--fade-solid-top) + var(--fade-ease));
  background:linear-gradient(to bottom,
    rgb(251,245,228) 0, rgb(251,245,228) calc(var(--fade-over) + var(--fade-solid-top)),
    rgba(251,245,228,0.6) calc(var(--fade-over) + var(--fade-solid-top) + var(--fade-ease) * 0.4),
    rgba(251,245,228,0.2) calc(var(--fade-over) + var(--fade-solid-top) + var(--fade-ease) * 0.75),
    rgba(251,245,228,0) 100%);
}
body::after{
  bottom:calc(-1 * var(--fade-over-bot));
  height:calc(var(--fade-over-bot) + var(--fade-solid-bot) + var(--fade-ease));
  background:linear-gradient(to top,
    rgb(251,245,228) 0, rgb(251,245,228) calc(var(--fade-over-bot) + var(--fade-solid-bot)),
    rgba(251,245,228,0.6) calc(var(--fade-over-bot) + var(--fade-solid-bot) + var(--fade-ease) * 0.4),
    rgba(251,245,228,0.2) calc(var(--fade-over-bot) + var(--fade-solid-bot) + var(--fade-ease) * 0.75),
    rgba(251,245,228,0) 100%);
}

/* ===== DOCK BAWAH: Harian / Bulanan ===== */
.dock-wrap{
  position:fixed; z-index:30; left:50%; transform:translateX(-50%);
  bottom:calc(12px + var(--safe-bottom));
  width:min(calc(100% - 24px), 420px);
  background:rgba(12,58,53,0.96);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  border:1px solid rgba(219,164,60,0.35);
  border-radius:22px; padding:6px;
  box-shadow:0 14px 30px -10px rgba(12,58,53,0.6);
}
.dock{display:flex; gap:4px;}
.dock button{
  flex:1 0 0; cursor:pointer; background:transparent; border:0;
  color:var(--cream-100); font-weight:600; font-size:13px;
  min-height:44px; border-radius:16px;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  transition:background .2s, color .2s;
}
.dock button svg{width:17px;height:17px;}
.dock button.active{background:var(--gold-500); color:var(--teal-950); font-weight:700;}

/* ===== MAIN ===== */
main{max-width:820px; margin:0 auto; padding:22px 16px calc(96px + var(--safe-bottom));}
.view[hidden]{display:none;}
.enter{animation:rise .38s ease both;}
@keyframes rise{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}

/* ===== PEMILIH TANGGAL ===== */
.picker{display:flex; align-items:stretch; gap:8px;}
.pk-btn{
  width:46px; flex-shrink:0; cursor:pointer;
  background:var(--white); border:1.5px solid var(--line); border-radius:14px;
  color:var(--teal-800); display:flex; align-items:center; justify-content:center;
  transition:background .15s, transform .15s;
}
.pk-btn:active{transform:scale(.95);}
.pk-btn:disabled{opacity:.35; cursor:default;}
.pk-btn svg{width:18px;height:18px;}
.pk-main{
  position:relative; flex:1; min-width:0;
  background:var(--white); border:1.5px solid var(--line); border-radius:14px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:8px 10px; text-align:center; cursor:pointer;
}
.pk-main small{font-size:9.5px; letter-spacing:1.8px; font-weight:600; color:var(--gold-600); text-transform:uppercase;}
.pk-main .pk-label{font-size:14.5px; font-weight:700; color:var(--ink-900); line-height:1.25;}
button.pk-main{font-family:inherit; color:inherit;}
button.pk-main:active{transform:scale(.99);}

/* ===== KALENDER KUSTOM ===== */
.cal-overlay{
  position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
  padding:16px; background:rgba(12,58,53,0.55);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  animation:fadeIn .2s ease both;
}
.cal-overlay[hidden]{display:none;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.cal{
  width:min(100%, 360px); background:var(--white);
  border:1.5px solid var(--line); border-radius:24px; overflow:hidden;
  box-shadow:0 30px 60px -20px rgba(12,58,53,0.7);
  animation:calPop .26s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes calPop{from{opacity:0; transform:translateY(14px) scale(.96);}to{opacity:1; transform:none;}}
.cal-head{
  display:flex; align-items:center; gap:6px; padding:12px 12px 12px;
  background:linear-gradient(150deg, var(--teal-950), var(--teal-700));
  border-bottom:1px solid rgba(219,164,60,0.4);
}
.cal-nav{
  width:38px; height:38px; flex-shrink:0; cursor:pointer; border:0; border-radius:12px;
  background:rgba(255,253,247,0.1); color:var(--cream-50);
  display:flex; align-items:center; justify-content:center; transition:background .15s;
}
.cal-nav:hover{background:rgba(255,253,247,0.2);}
.cal-nav:disabled{opacity:.3; cursor:default;}
.cal-nav svg{width:17px; height:17px;}
.cal-title{
  flex:1; cursor:pointer; border:0; background:transparent; color:var(--cream-50);
  font-family:'Bebas Neue',cursive; font-size:25px; letter-spacing:.8px; line-height:1;
  padding:6px 4px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.cal-title:hover{background:rgba(255,253,247,0.08);}
.cal-title svg{width:13px; height:13px; color:var(--gold-500);}
.cal-title.static{cursor:default;}
.cal-title.static:hover{background:transparent;}
.cal-body{padding:12px 12px 6px;}
.cal-week,.cal-days{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-week{margin-bottom:6px;}
.cal-week span{text-align:center; font-size:10px; letter-spacing:.8px; font-weight:700; color:var(--gold-600); text-transform:uppercase; padding:4px 0;}
.cal-week span:last-child{color:var(--rust-600);}
.cal-day{
  position:relative; aspect-ratio:1/1; cursor:pointer; border:0; background:transparent;
  border-radius:13px; font-size:13.5px; font-weight:600; color:var(--ink-900);
  display:flex; align-items:center; justify-content:center; transition:background .12s, transform .12s;
}
.cal-day:hover:not(:disabled):not(.sel){background:var(--gold-100);}
.cal-day:active:not(:disabled){transform:scale(.92);}
.cal-day.sun{color:var(--rust-600);}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--gold-500);}
.cal-day.sel{background:var(--teal-950); color:var(--cream-50); box-shadow:none; font-weight:700;}
.cal-day:disabled{opacity:.28; cursor:default;}
.cal-day.has::after{
  content:''; position:absolute; bottom:5px; left:50%; width:5px; height:5px; margin-left:-2.5px;
  border-radius:50%; background:var(--gold-500);
}
.cal-day.sel.has::after{background:var(--gold-500);}
.cal-day.blank{visibility:hidden; pointer-events:none;}
.cal-months{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:4px 0 6px;}
.cal-mon{
  cursor:pointer; border:1.5px solid var(--line); background:var(--white); border-radius:14px;
  padding:14px 0; font-size:13.5px; font-weight:600; color:var(--ink-900); transition:all .12s;
}
.cal-mon:hover:not(:disabled):not(.sel){background:var(--gold-100);}
.cal-mon.now{border-color:var(--gold-500);}
.cal-mon.sel{background:var(--teal-950); border-color:var(--teal-950); color:var(--cream-50); font-weight:700;}
.cal-mon:disabled{opacity:.28; cursor:default;}
.cal-foot{display:flex; gap:8px; padding:8px 12px 14px;}
.cal-foot button{
  flex:1; cursor:pointer; min-height:42px; border-radius:14px; font-size:13px; font-weight:700;
  border:1.5px solid var(--line); background:transparent; color:var(--ink-600);
}
.cal-foot button.primary{background:var(--gold-500); border-color:var(--gold-500); color:var(--teal-950);}
.cal-legend{display:flex; align-items:center; justify-content:center; gap:6px; font-size:10.5px; color:var(--ink-600); padding:2px 12px 4px;}
.cal-legend i{width:6px; height:6px; border-radius:50%; background:var(--gold-500); display:inline-block;}
.chips{display:flex; gap:8px; margin:10px 0 18px;}
.chip{
  cursor:pointer; background:transparent; border:1.5px solid var(--line);
  color:var(--ink-600); font-size:12px; font-weight:600;
  padding:6px 14px; border-radius:100px; transition:all .15s;
}
.chip.on{background:var(--teal-950); border-color:var(--teal-950); color:var(--cream-50);}
.chip.right{margin-left:auto; border-color:var(--gold-500); color:var(--teal-800); display:inline-flex; align-items:center; gap:6px;}
.chip.right svg{width:14px;height:14px;}

/* ===== HERO ===== */
.hero{
  position:relative; overflow:hidden; color:var(--cream-50);
  background:linear-gradient(150deg, var(--teal-950) 0%, var(--teal-700) 100%);
  border:1px solid rgba(219,164,60,0.4); border-radius:22px;
  padding:20px 18px 16px;
  box-shadow:0 18px 34px -18px rgba(12,58,53,0.75);
}
.hero::after{
  content:''; position:absolute; right:-60px; top:-60px; width:200px; height:200px; border-radius:50%;
  background:radial-gradient(circle, rgba(219,164,60,0.28), rgba(219,164,60,0) 70%); pointer-events:none;
}
.hero-label{font-size:10px; letter-spacing:2.2px; font-weight:600; color:var(--gold-500);}
.hero-amount{font-family:'Bebas Neue',cursive; font-size:54px; line-height:1.02; letter-spacing:.5px; margin-top:2px;}
.hero-amount span{font-family:'Poppins',sans-serif; font-size:17px; font-weight:600; color:var(--cream-100); margin-right:6px; letter-spacing:0;}
.hero-split{display:flex; gap:10px; margin-top:12px;}
.hero-split > div{flex:1; background:rgba(255,253,247,0.09); border:1px solid rgba(255,253,247,0.12); border-radius:14px; padding:9px 12px;}
.hero small{display:block; font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--cream-100); opacity:.8; font-weight:500;}
.hero-split b{font-family:'Bebas Neue',cursive; font-weight:400; font-size:22px; letter-spacing:.4px;}
.hero-foot{display:flex; gap:10px; margin-top:12px; padding-top:12px; border-top:1px dashed rgba(219,164,60,0.4);}
.hero-foot > div{flex:1;}
.hero-foot b{font-family:'Bebas Neue',cursive; font-weight:400; font-size:24px; letter-spacing:.4px; display:block;}
.hero-foot .neg{color:#ffb3a3;}
.hero-foot .bersih{color:var(--gold-500);}
.hero-foot .bersih.minus{color:#ffb3a3;}

/* ===== KARTU STAT ===== */
.stats{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:14px;}
@media (min-width:640px){ .stats{grid-template-columns:repeat(4,1fr);} .stats.six{grid-template-columns:repeat(3,1fr);} }
.stat{
  background:var(--white); border:1.5px solid var(--line); border-radius:16px;
  padding:12px 13px 12px; position:relative; overflow:hidden;
}
.stat::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c, var(--teal-600));}
.stat small{display:block; font-size:10px; letter-spacing:1.1px; text-transform:uppercase; font-weight:600; color:var(--ink-600);}
.stat b{display:block; font-family:'Bebas Neue',cursive; font-weight:400; letter-spacing:.4px; font-size:25px; line-height:1.15; color:var(--cv, var(--teal-800)); margin-top:2px;}
.stat b::before{content:'Rp '; font-family:'Poppins',sans-serif; font-size:11.5px; font-weight:600; color:var(--ink-600); letter-spacing:0;}
.stat b.plain::before{content:none;}
.stat em{display:block; font-style:normal; font-size:10.5px; color:var(--ink-600); margin-top:1px;}

/* ===== BLOK DAFTAR ===== */
.block{
  margin-top:18px; background:var(--white);
  border:1.5px solid var(--line); border-radius:18px; overflow:hidden;
}
.block-head{
  display:flex; align-items:center; gap:10px; padding:13px 15px 11px;
  background:linear-gradient(to bottom, var(--gold-100), var(--white));
  border-bottom:1px solid var(--line);
}
.block-head h3{margin:0; font-family:'Bebas Neue',cursive; font-weight:400; font-size:22px; letter-spacing:.6px; color:var(--teal-800); line-height:1;}
.count{font-size:10.5px; font-weight:700; color:var(--teal-800); background:var(--cream-100); border-radius:100px; padding:2px 9px;}
.block-head .sub{margin-left:auto; font-family:'Bebas Neue',cursive; font-size:21px; letter-spacing:.4px; color:var(--c, var(--teal-700));}
.row{display:flex; align-items:center; gap:12px; padding:11px 15px; border-bottom:1px dashed var(--line);}
.row:last-child{border-bottom:0;}
.row-main{flex:1; min-width:0;}
.row-title{font-size:13.5px; font-weight:600; line-height:1.35; overflow-wrap:anywhere;}
.row-sub{display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin-top:4px;}
.row-amt{font-family:'Bebas Neue',cursive; font-size:21px; letter-spacing:.4px; color:var(--teal-700); white-space:nowrap; text-align:right;}
.row-amt.out{color:var(--rust-700);}
.row-amt.strong{font-size:25px;}
.amt-free{font-family:'Poppins',sans-serif; font-size:11px; font-weight:700; color:var(--ink-600); letter-spacing:.5px; text-transform:uppercase;}
.tag,.met{font-size:9.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:2px 8px; border-radius:100px; line-height:1.5;}
.tag{background:var(--gold-100); color:var(--gold-600); border:1px solid #efd9a0;}
.tag.dp{background:#e0eef9; color:#26618c; border-color:#c4dcee;}
.tag.lunas{background:#ece4f6; color:#6a43a0; border-color:#d8c9ec;}
.tag.spar{background:#fbe5df; color:var(--rust-700); border-color:#f0c6bb;}
.met{background:#e3f1e8; color:#1f6b45;}
.met.non{background:#e1eef7; color:#1f5f86;}
.met.mix{background:#f6ecd0; color:#8a6417;}
.met.free{background:#ececec; color:#666;}
.note{font-size:10.5px; color:var(--ink-600);}
.empty{padding:22px 15px; text-align:center; font-size:12.5px; color:var(--ink-600);}
.row.total{background:var(--cream-50);}
.row.total .row-title{font-weight:800; color:var(--teal-800);}
.row.warn .row-title{color:var(--rust-700);}

/* ===== GRAFIK ===== */
.chart-card{margin-top:18px; background:var(--white); border:1.5px solid var(--line); border-radius:18px; padding:14px 14px 10px;}
.chart-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
.chart-head h3{margin:0; font-family:'Bebas Neue',cursive; font-weight:400; font-size:22px; letter-spacing:.6px; color:var(--teal-800); line-height:1;}
.legend{margin-left:auto; display:flex; gap:12px; font-size:10.5px; color:var(--ink-600); font-weight:500;}
.legend i{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; vertical-align:-1px;}
.chart{display:flex; gap:5px; overflow-x:auto; padding-bottom:6px; scrollbar-width:thin;}
.bar-col{flex:0 0 22px; background:none; border:0; padding:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px;}
.bars{height:116px; width:100%; display:flex; align-items:flex-end; gap:2px; border-bottom:1.5px solid var(--line);}
.bars i{flex:1; display:block; border-radius:4px 4px 0 0; min-width:0;}
.b-in{background:linear-gradient(to top, var(--teal-700), var(--teal-600));}
.b-out{background:linear-gradient(to top, var(--rust-700), var(--rust-600));}
.bar-day{font-size:10px; font-weight:600; color:var(--ink-600);}
.bar-col.is-today .bar-day{color:var(--cream-50); background:var(--teal-950); border-radius:100px; padding:0 5px;}
.bar-col:hover .bars{filter:brightness(1.08);}

/* ===== TABEL BULANAN ===== */
.tbl-wrap{margin-top:18px; background:var(--white); border:1.5px solid var(--line); border-radius:18px; overflow:hidden;}
.tbl-scroll{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:12px; min-width:470px; font-variant-numeric:tabular-nums;}
thead th{
  background:var(--teal-950); color:var(--cream-100); font-weight:600; font-size:10px;
  letter-spacing:.9px; text-transform:uppercase; padding:11px 10px; text-align:right; white-space:nowrap;
}
thead th:first-child{text-align:left; position:sticky; left:0; z-index:2;}
tbody td{padding:10px; text-align:right; border-bottom:1px dashed var(--line); white-space:nowrap;}
tbody td:first-child{text-align:left; position:sticky; left:0; background:inherit; font-weight:600; z-index:1;}
tbody tr{cursor:pointer; background:var(--white);}
tbody tr:nth-child(even){background:#fcf8ec;}
tbody tr:hover{background:var(--gold-100);}
tbody tr.zero td{opacity:.42;}
tbody td small{font-size:9.5px; font-weight:500; color:var(--ink-600); margin-left:4px; text-transform:uppercase; letter-spacing:.5px;}
td.out{color:var(--rust-700);}
td.net{font-weight:700; color:var(--teal-800);}
td.net.minus{color:var(--rust-700);}
tfoot td{background:var(--gold-100); font-weight:800; padding:12px 10px; text-align:right; border-top:2px solid var(--gold-500); white-space:nowrap;}
tfoot td:first-child{text-align:left; position:sticky; left:0; font-family:'Bebas Neue',cursive; font-weight:400; font-size:17px; letter-spacing:.6px;}
tfoot td.out{color:var(--rust-700);}
tfoot td.net{color:var(--teal-800);}
tfoot td.net.minus{color:var(--rust-700);}
/* Daftar kartu per hari: khusus HP (tanpa geser samping) */
.dl-list{display:none;}
.dl-item{padding:11px 14px 12px; border-bottom:1px dashed var(--line); cursor:pointer; background:var(--white);}
.dl-item:nth-child(even){background:#fcf8ec;}
.dl-item:active{background:var(--gold-100);}
.dl-top{display:flex; align-items:center; gap:10px;}
.dl-date{display:flex; align-items:baseline; gap:6px; flex:1;}
.dl-date b{font-family:'Bebas Neue',cursive; font-weight:400; font-size:26px; letter-spacing:.5px; color:var(--teal-800); line-height:1;}
.dl-date small{font-size:10px; font-weight:700; letter-spacing:.9px; text-transform:uppercase; color:var(--gold-600);}
.dl-net{text-align:right; line-height:1;}
.dl-net small{display:block; font-size:9px; letter-spacing:1px; text-transform:uppercase; font-weight:600; color:var(--ink-600); margin-bottom:2px;}
.dl-net b{font-family:'Bebas Neue',cursive; font-weight:400; font-size:23px; letter-spacing:.4px; color:var(--teal-700);}
.dl-net.minus b{color:var(--rust-700);}
.dl-mini{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px;}
.dl-mini > div{background:var(--cream-50); border:1px solid var(--line); border-radius:10px; padding:5px 8px;}
.dl-mini small{display:block; font-size:8.5px; letter-spacing:.9px; text-transform:uppercase; font-weight:600; color:var(--ink-600);}
.dl-mini span{display:block; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:1px;}
.dl-mini .out span{color:var(--rust-700);}
.dl-empty{margin-top:4px; font-size:11px; color:var(--ink-600);}
.dl-item.zero .dl-date b{color:var(--ink-600); opacity:.55;}
.dl-item.zero{padding:9px 14px;}
.dl-item.zero .dl-top{align-items:center;}
.dl-total{background:var(--gold-100) !important; border-top:2px solid var(--gold-500); border-bottom:0; cursor:default;}
.dl-total .dl-date b{font-size:22px;}
@media (max-width:600px){
  .tbl-scroll{display:none;}
  .dl-list{display:block;}
}
.tbl-hint{font-size:10.5px; color:var(--ink-600); text-align:center; padding:9px 12px 11px; background:var(--white);}

/* ===== STATE ===== */
.state-box{text-align:center; padding:60px 20px; color:var(--ink-600);}
.state-box .display{font-size:26px; color:var(--teal-800); margin-bottom:6px;}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--line); border-top-color:var(--teal-700); margin:0 auto 14px; animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.foot{margin-top:22px; text-align:center; font-size:10.5px; color:var(--ink-600);}
.foot .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:#2f9e62; margin-right:6px; vertical-align:1px; animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{50%{opacity:.35;}}

@media (max-width:420px){
  .hero-amount{font-size:46px;}
  .stat b{font-size:22px;}
}
@media print{
  .topbar,.dock-wrap,.picker,.chips,body::before,body::after{display:none !important;}
  main{padding:0;}
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

/* ============ FIREBASE (read-only, project yang sama dengan admin) ============
   Hanya node keuangan yang dibaca:
   - pemasukan        : pemasukan lapangan / uang masuk manual
   - pelunasanMember  : pelunasan member
   - minuman          : penjualan minuman
   - pengeluaran      : uang keluar
   - booking          : HANYA field DP (dp, tglDp, metode, nama, tgl) untuk hitung DP,
                        sama seperti Rekap Harian di admin.
   ============================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDO6gVCRzTClDEwAS2FAWZVf-pB5CG2Pbc",
  authDomain: "foto-mahasiswa.firebaseapp.com",
  databaseURL: "https://foto-mahasiswa-default-rtdb.firebaseio.com",
  projectId: "foto-mahasiswa",
  storageBucket: "foto-mahasiswa.firebasestorage.app",
  messagingSenderId: "829974127023",
  appId: "1:829974127023:web:95f3f0dfe36e2644f40f5a",
  measurementId: "G-ZYMW08YG9Y"
};
const db = getDatabase(initializeApp(firebaseConfig));

/* ============ HELPER ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = n => (Number(n)||0).toLocaleString('id-ID');
const rp = n => (n < 0 ? '-Rp ' : 'Rp ') + fmt(Math.abs(n));
const ymd = v => String(v || '').split('T')[0];
const pad = n => String(n).padStart(2,'0');
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return toStr(d); };
const addMonths = (ym,n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const dmy = s => String(s||'').split('-').reverse().join('/');
const todayStr = () => toStr(new Date());

/* ============ LOGIKA PEMBAYARAN (disalin dari admin) ============ */
function payParts(item, n){
  const met = item?.['metode'+n] || item?.metode || 'Cash';
  const jml = Number(item?.['jumlah'+n] ?? (n===1 ? item?.jumlah : 0) ?? 0);
  const metA = item?.['metode'+n+'a'] || 'Cash';
  const metB = item?.['metode'+n+'b'] || '';
  const jmlB = Number(item?.['jumlah'+n+'b'] || 0);
  if(met === 'Campuran'){
    const hasA = item?.['jumlah'+n+'a'] !== undefined && item?.['jumlah'+n+'a'] !== null;
    const jmlA = hasA ? Number(item?.['jumlah'+n+'a'] || 0) : Math.max(0, jml - jmlB);
    return [{metode:metA, jumlah:jmlA},{metode:metB || 'QRIS', jumlah:jmlB}]
      .filter(x => x.jumlah>0 || x.metode==='Free' || x.metode==='Belum Bayar');
  }
  return [{metode:met, jumlah:jml}];
}
const NOVALUE = ['Free','Belum Bayar'];
const payTotal = (it,n) => payParts(it,n).reduce((s,x)=> s + (NOVALUE.includes(x.metode) ? 0 : Number(x.jumlah||0)), 0);
const payCash  = (it,n) => payParts(it,n).reduce((s,x)=> s + (x.metode==='Cash' ? Number(x.jumlah||0) : 0), 0);
const payNon   = (it,n) => payParts(it,n).reduce((s,x)=> s + ((x.metode && !['Cash',...NOVALUE].includes(x.metode)) ? Number(x.jumlah||0) : 0), 0);

function metClass(txt){
  const t = String(txt||'').toLowerCase();
  if(!t) return '';
  if(t.includes('+')) return 'mix';
  if(t === 'free' || t === 'belum bayar') return 'free';
  if(t === 'cash') return '';
  return 'non';
}

/* ============ DATA & INDEX PER TANGGAL ============ */
const NODES = ['pemasukan','minuman','pengeluaran','pelunasanMember','booking'];
const DATA = {};
const loaded = new Set();
let loadError = null;
let DAYS = {};
let lastUpdate = null;

function dayObj(d){ return DAYS[d] || (DAYS[d] = {lap:[], min:[], out:[]}); }

function buildIndex(){
  DAYS = {};

  // 1) Pemasukan lapangan / uang masuk manual
  Object.values(DATA.pemasukan || {}).forEach(item => {
    if(!item || typeof item !== 'object') return;
    const d = ymd(item.tgl); if(!d) return;
    const kk = Number(item.totalKaosKaki || 0);
    const t1 = payTotal(item,1), t2 = payTotal(item,2);
    const amount = t1 + t2 + kk;
    let cash = payCash(item,1) + payCash(item,2);
    let non  = payNon(item,1) + payNon(item,2);
    const met1 = item.metode1 || item.metode || 'Cash';
    if(kk > 0){
      if(met1 === 'Cash') cash += kk;
      else if(!NOVALUE.includes(met1)) non += kk;
    }
    const jenis = String(item.jenisPembayaran || '').trim().toLowerCase();
    const isManual = jenis === 'manual' || item.manual === true ||
      String(item.sumber || '').trim().toLowerCase() === 'manual-uang-masuk' ||
      (String(item.kategori || '').trim().toLowerCase() === 'uang masuk' && !String(item.timNamaBersih || '').trim() && !String(item.timNama2 || '').trim());
    const isSparing = jenis === 'sparing' || !!String(item.timNama2 || '').trim();

    const mets = [];
    [1,2].forEach(n => payParts(item,n).forEach(p => { if(p.jumlah > 0 && !mets.includes(p.metode)) mets.push(p.metode); }));
    if(kk > 0 && !mets.includes(met1) && !NOVALUE.includes(met1)) mets.push(met1);
    const metode = mets.length ? mets.join(' + ') : met1;

    dayObj(d).lap.push({
      title: item.ket || 'Pemasukan',
      tag: isManual ? 'Uang Masuk' : (isSparing ? 'Sparing' : 'Sewa'),
      tagCls: isSparing && !isManual ? 'spar' : '',
      metode, amount, cash, non,
      free: amount === 0 && NOVALUE.includes(met1),
      note: kk > 0 ? `termasuk kaos kaki Rp ${fmt(kk)}` : ''
    });
  });

  // 2) Pelunasan member (dihitung di tanggal bayar)
  Object.values(DATA.pelunasanMember || {}).forEach(item => {
    if(!item || typeof item !== 'object') return;
    const d = ymd(item.tanggalBayar); if(!d) return;
    const jumlah = Number(item.jumlah || 0);
    if(!Number.isFinite(jumlah) || jumlah <= 0) return;
    const metode = String(item.metode || 'Cash');
    dayObj(d).lap.push({
      title: 'Pelunasan — ' + (item.member || '-'),
      tag: 'Pelunasan', tagCls: 'lunas',
      metode, amount: jumlah,
      cash: metode === 'Cash' ? jumlah : 0,
      non: (metode !== 'Cash' && !NOVALUE.includes(metode)) ? jumlah : 0,
      note: item.tanggalJadwalDipilih ? 'jadwal ' + dmy(item.tanggalJadwalDipilih) : ''
    });
  });

  // 3) DP booking (dicatat di tanggal DP, fallback tanggal main)
  Object.values(DATA.booking || {}).forEach(item => {
    if(!item || typeof item !== 'object') return;
    const dp = Number(item.dp || 0);
    if(dp <= 0) return;
    const d = ymd(item.tglDp) || ymd(item.tgl);
    if(!d) return;
    const metode = item.metode || 'Cash';
    const jam = String(item.tgl || '').split('T')[1];
    dayObj(d).lap.push({
      title: item.nama || '-',
      tag: 'DP', tagCls: 'dp',
      metode, amount: dp,
      cash: metode === 'Cash' ? dp : 0,
      non: metode === 'Cash' ? 0 : dp,
      note: 'main ' + dmy(ymd(item.tgl)) + (jam ? ' ' + jam.substring(0,5).replace(':','.') : '')
    });
  });

  // 4) Minuman
  Object.values(DATA.minuman || {}).forEach(item => {
    if(!item || typeof item !== 'object') return;
    const d = ymd(item.tgl); if(!d) return;
    const met = item.metode || 'Cash';
    const free = met === 'Free';
    const amount = free ? 0 : Number(item.total || 0);
    dayObj(d).min.push({
      title: item.produk || 'Minuman',
      tag: '', metode: met, amount,
      cash: met === 'Cash' ? amount : 0,
      non: (met !== 'Cash' && !free) ? amount : 0,
      free,
      note: `${Number(item.jumlahPcs || 0)} pcs`
    });
  });

  // 5) Pengeluaran (dihitung di tanggal sumber cash)
  Object.values(DATA.pengeluaran || {}).forEach(item => {
    if(!item || typeof item !== 'object') return;
    const catat = ymd(item.tgl);
    const d = ymd(item.sumberTgl) || catat; if(!d) return;
    dayObj(d).out.push({
      title: item.ket || 'Pengeluaran',
      tag: '', metode: '',
      amount: Number(item.jumlah || 0),
      note: (catat && catat !== d) ? 'dicatat ' + dmy(catat) : ''
    });
  });
}

const EMPTY_DAY = {lap:[], min:[], out:[]};
function summarize(d){
  const o = DAYS[d] || EMPTY_DAY;
  let lap=0, lapCash=0, lapNon=0, min=0, minCash=0, minNon=0, out=0;
  o.lap.forEach(r => { lap += r.amount; lapCash += r.cash; lapNon += r.non; });
  o.min.forEach(r => { min += r.amount; minCash += r.cash; minNon += r.non; });
  o.out.forEach(r => { out += r.amount; });
  // Alokasi pengeluaran: utamakan cash lapangan, kekurangannya dari cash minuman
  const outLap = Math.min(out, lapCash);
  const outMin = Math.min(Math.max(0, out - outLap), minCash);
  const short  = Math.max(0, out - outLap - outMin);
  const sisaLap = Math.max(0, lapCash - outLap);
  const sisaMin = Math.max(0, minCash - outMin);
  return {
    lap, lapCash, lapNon, min, minCash, minNon, out,
    outLap, outMin, short, sisaLap, sisaMin, sisaCash: sisaLap + sisaMin,
    masuk: lap + min, cash: lapCash + minCash, non: lapNon + minNon,
    bersih: lap + min - out,
    has: !!(o.lap.length || o.min.length || o.out.length)
  };
}

/* ============ STATE ============ */
let view = 'harian';
let selDate = todayStr();
let selMonth = selDate.slice(0,7);

/* ============ KOMPONEN HTML ============ */
function rowHtml(r, outCls){
  const amt = r.free ? '<span class="amt-free">Gratis</span>' : rp(r.amount);
  return `<div class="row">
    <div class="row-main">
      <div class="row-title">${esc(r.title)}</div>
      <div class="row-sub">
        ${r.tag ? `<span class="tag ${r.tagCls||''}">${esc(r.tag)}</span>` : ''}
        ${r.metode ? `<span class="met ${metClass(r.metode)}">${esc(r.metode)}</span>` : ''}
        ${r.note ? `<span class="note">${esc(r.note)}</span>` : ''}
      </div>
    </div>
    <div class="row-amt ${outCls||''}">${amt}</div>
  </div>`;
}
function blockHtml(title, rows, subtotal, color, outCls, emptyText){
  return `<section class="block" style="--c:${color}">
    <div class="block-head">
      <h3>${esc(title)}</h3><span class="count">${rows.length}</span>
      <span class="sub">${rp(subtotal)}</span>
    </div>
    ${rows.length ? rows.map(r => rowHtml(r, outCls)).join('') : `<div class="empty">${esc(emptyText)}</div>`}
  </section>`;
}
function simpleRow(label, value, cls){
  return `<div class="row ${cls||''}"><div class="row-main"><div class="row-title">${esc(label)}</div></div><div class="row-amt ${cls==='total'?'strong':''}">${rp(value)}</div></div>`;
}
function heroHtml(label, s, labelBersih){
  return `<div class="hero">
    <div class="hero-label">${esc(label)}</div>
    <div class="hero-amount"><span>Rp</span>${fmt(s.masuk)}</div>
    <div class="hero-split">
      <div><small>Cash</small><b>${rp(s.cash)}</b></div>
      <div><small>QRIS / Transfer</small><b>${rp(s.non)}</b></div>
    </div>
    <div class="hero-foot">
      <div><small>Pengeluaran</small><b class="neg">${rp(s.out)}</b></div>
      <div><small>${esc(labelBersih)}</small><b class="bersih ${s.bersih<0?'minus':''}">${rp(s.bersih)}</b></div>
    </div>
  </div>`;
}
function statHtml(label, value, color, extra){
  return `<div class="stat" style="--c:${color};--cv:${color}"><small>${esc(label)}</small><b>${fmt(value)}</b>${extra?`<em>${esc(extra)}</em>`:''}</div>`;
}

/* ============ RENDER: HARIAN ============ */
function renderHarian(){
  const s = summarize(selDate);
  const o = DAYS[selDate] || EMPTY_DAY;

  let html = heroHtml('TOTAL PEMASUKAN', s, 'Hasil Bersih');
  html += `<div class="stats">
    ${statHtml('Sewa Lapangan', s.lap, 'var(--teal-600)')}
    ${statHtml('Penjualan Minuman', s.min, 'var(--gold-600)')}
    ${statHtml('Pengeluaran', s.out, 'var(--rust-700)')}
    ${statHtml('Cash Seharusnya', s.sisaCash, 'var(--teal-800)', 'setelah pengeluaran')}
  </div>`;

  html += blockHtml('Sewa Lapangan', o.lap, s.lap, 'var(--teal-700)', '', 'Belum ada pemasukan lapangan.');
  html += blockHtml('Penjualan Minuman', o.min, s.min, 'var(--gold-600)', '', 'Belum ada penjualan minuman.');
  html += blockHtml('Pengeluaran', o.out, s.out, 'var(--rust-700)', 'out', 'Tidak ada pengeluaran.');

  html += `<section class="block">
    <div class="block-head"><h3>Rincian Kas</h3></div>
    ${simpleRow('Cash masuk — lapangan', s.lapCash)}
    ${simpleRow('Cash masuk — minuman', s.minCash)}
    ${simpleRow('QRIS / Transfer masuk', s.non)}
    ${simpleRow('Pengeluaran dari cash lapangan', s.outLap)}
    ${simpleRow('Pengeluaran dari cash minuman', s.outMin)}
    ${s.short > 0 ? simpleRow('Pengeluaran melebihi cash tersedia', s.short, 'warn') : ''}
    ${simpleRow('Sisa cash lapangan', s.sisaLap)}
    ${simpleRow('Sisa cash minuman', s.sisaMin)}
    ${simpleRow('Total cash seharusnya', s.sisaCash, 'total')}
  </section>`;
  return html;
}

/* ============ RENDER: BULANAN ============ */
function monthDates(ym){
  const [y,m] = ym.split('-').map(Number);
  const n = new Date(y, m, 0).getDate();
  let list = Array.from({length:n}, (_,i) => `${ym}-${pad(i+1)}`);
  const t = todayStr();
  if(ym === t.slice(0,7)) list = list.filter(d => d <= t);
  else if(ym > t.slice(0,7)) list = [];
  return list;
}
const HARI = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];

function monthData(ym){
  const dates = monthDates(ym);
  const days = dates.map(d => ({d, s: summarize(d)}));
  const T = days.reduce((a,{s}) => {
    ['lap','min','masuk','cash','non','out','bersih','sisaCash'].forEach(k => a[k] = (a[k]||0) + s[k]);
    if(s.masuk > 0) a.aktif++;
    return a;
  }, {aktif:0});
  ['lap','min','masuk','cash','non','out','bersih','sisaCash'].forEach(k => T[k] = T[k] || 0);
  return {days, T};
}

function renderBulanan(){
  const {days, T} = monthData(selMonth);
  let html = heroHtml('TOTAL PEMASUKAN BULAN INI', T, 'Hasil Bersih');

  let best = null;
  days.forEach(x => { if(x.s.masuk > 0 && (!best || x.s.masuk > best.s.masuk)) best = x; });
  const avg = T.aktif ? Math.round(T.masuk / T.aktif) : 0;

  html += `<div class="stats six">
    ${statHtml('Sewa Lapangan', T.lap, 'var(--teal-600)')}
    ${statHtml('Penjualan Minuman', T.min, 'var(--gold-600)')}
    ${statHtml('Pengeluaran', T.out, 'var(--rust-700)')}
    ${statHtml('Rata-rata / Hari', avg, 'var(--teal-800)', T.aktif ? `dari ${T.aktif} hari ada pemasukan` : 'belum ada data')}
    ${statHtml('Hari Terbaik', best ? best.s.masuk : 0, 'var(--gold-600)', best ? `${HARI[parse(best.d).getDay()]}, ${dmy(best.d).slice(0,5)}` : '-')}
    ${statHtml('Cash Seharusnya', T.sisaCash, 'var(--teal-700)', 'total sisa cash harian')}
  </div>`;

  if(!days.length){
    return html + `<div class="state-box"><div class="display">Belum ada data</div><div>Bulan ini belum dimulai.</div></div>`;
  }

  // Grafik
  const maxV = Math.max(1, ...days.map(x => Math.max(x.s.masuk, x.s.out)));
  const h = v => v > 0 ? Math.max(3, v / maxV * 100) : 0;
  const t = todayStr();
  html += `<div class="chart-card">
    <div class="chart-head"><h3>Grafik Harian</h3>
      <div class="legend"><span><i style="background:var(--teal-700)"></i>Masuk</span><span><i style="background:var(--rust-600)"></i>Keluar</span></div>
    </div>
    <div class="chart" id="chart">
      ${days.map(({d,s}) => `<button class="bar-col${d===t?' is-today':''}" data-date="${d}" title="${esc(dmy(d))} — Masuk ${rp(s.masuk)} • Keluar ${rp(s.out)}">
        <span class="bars"><i class="b-in" style="height:${h(s.masuk)}%"></i><i class="b-out" style="height:${h(s.out)}%"></i></span>
        <span class="bar-day">${Number(d.slice(8))}</span></button>`).join('')}
    </div>
  </div>`;

  // Tabel rincian per hari (terbaru di atas)
  const num = n => n ? fmt(n) : '–';
  const rows = [...days].reverse().map(({d,s}) => `<tr data-date="${d}" class="${s.has ? '' : 'zero'}">
      <td>${Number(d.slice(8))}<small>${HARI[parse(d).getDay()]}</small></td>
      <td>${num(s.lap)}</td><td>${num(s.min)}</td><td class="out">${num(s.out)}</td>
      <td class="net ${s.bersih<0?'minus':''}">${s.has ? fmt(s.bersih) : '–'}</td>
    </tr>`).join('');
  const mini = s => `<div class="dl-mini">
      <div><small>Lapangan</small><span>${num(s.lap)}</span></div>
      <div><small>Minuman</small><span>${num(s.min)}</span></div>
      <div class="out"><small>Keluar</small><span>${num(s.out)}</span></div></div>`;
  const list = [...days].reverse().map(({d,s}) => `<div class="dl-item${s.has?'':' zero'}" data-date="${d}">
      <div class="dl-top">
        <div class="dl-date"><b>${Number(d.slice(8))}</b><small>${HARI[parse(d).getDay()]}</small></div>
        ${s.has ? `<div class="dl-net ${s.bersih<0?'minus':''}"><small>Bersih</small><b>${rp(s.bersih)}</b></div>` : '<span class="dl-empty">Tidak ada transaksi</span>'}
      </div>
      ${s.has ? mini(s) : ''}
    </div>`).join('');
  const listTotal = `<div class="dl-item dl-total">
      <div class="dl-top">
        <div class="dl-date"><b>TOTAL</b></div>
        <div class="dl-net ${T.bersih<0?'minus':''}"><small>Bersih</small><b>${rp(T.bersih)}</b></div>
      </div>${mini(T)}</div>`;
  html += `<div class="tbl-wrap">
    <div class="block-head"><h3>Rincian Per Hari</h3><span class="count">${days.length} hari</span></div>
    <div class="dl-list">${listTotal}${list}</div>
    <div class="tbl-scroll"><table>
      <thead><tr><th>Tgl</th><th>Lapangan</th><th>Minuman</th><th>Keluar</th><th>Bersih</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>Total</td><td>${fmt(T.lap)}</td><td>${fmt(T.min)}</td><td class="out">${fmt(T.out)}</td><td class="net ${T.bersih<0?'minus':''}">${fmt(T.bersih)}</td></tr></tfoot>
    </table></div>
    <div class="tbl-hint">Angka dalam Rupiah • ketuk baris untuk melihat laporan hari itu</div>
  </div>`;
  return html;
}

/* ============ PAINT ============ */
function paint(el, html, animate){
  el.innerHTML = html;
  if(animate){ el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); }
}
function stateHtml(){
  if(loadError) return `<div class="state-box"><div class="display">Gagal memuat laporan</div><div>Cek koneksi internet, lalu muat ulang halaman.</div></div>`;
  return null;
}
function ready(){ return NODES.every(n => loaded.has(n)); }

function render(animate){
  const t = todayStr();

  // label & kontrol
  $('dLabel').textContent = parse(selDate).toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  $('dNext').disabled = selDate >= t;
  $('dToday').classList.toggle('on', selDate === t);
  $('dYest').classList.toggle('on', selDate === addDays(t,-1));

  const thisM = t.slice(0,7);
  $('mLabel').textContent = parse(selMonth + '-01').toLocaleDateString('id-ID', {month:'long', year:'numeric'});
  $('mNext').disabled = selMonth >= thisM;
  $('mThis').classList.toggle('on', selMonth === thisM);
  $('mLast').classList.toggle('on', selMonth === addMonths(thisM,-1));

  const err = stateHtml();
  if(err){ $('harianBody').innerHTML = err; $('bulananBody').innerHTML = err; return; }
  if(!ready()) return;

  if(view === 'harian') paint($('harianBody'), renderHarian(), animate);
  else {
    paint($('bulananBody'), renderBulanan(), animate);
    if(animate){
      const c = $('chart'), col = c && (c.querySelector('.is-today') || c.lastElementChild);
      if(col) c.scrollLeft = col.offsetLeft - c.clientWidth/2;
    }
  }
  lastUpdate = new Date();
  $('foot').innerHTML = `<span class="dot"></span>Tersinkron langsung dari sistem admin • diperbarui ${pad(lastUpdate.getHours())}:${pad(lastUpdate.getMinutes())}`;
}

/* ============ NAVIGASI ============ */
function setView(v){
  view = v;
  $('view-harian').hidden = v !== 'harian';
  $('view-bulanan').hidden = v !== 'bulanan';
  document.querySelectorAll('.dock button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  window.scrollTo({top:0, behavior:'auto'});
  render(true);
}
document.querySelectorAll('.dock button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

const nav = () => render(true);
$('dPrev').onclick = () => { selDate = addDays(selDate,-1); nav(); };
$('dNext').onclick = () => { if(selDate < todayStr()){ selDate = addDays(selDate,1); nav(); } };
$('dToday').onclick = () => { selDate = todayStr(); nav(); };
$('dYest').onclick = () => { selDate = addDays(todayStr(),-1); nav(); };
$('mPrev').onclick = () => { selMonth = addMonths(selMonth,-1); nav(); };
$('mNext').onclick = () => { if(selMonth < todayStr().slice(0,7)){ selMonth = addMonths(selMonth,1); nav(); } };
$('mThis').onclick = () => { selMonth = todayStr().slice(0,7); nav(); };
$('mLast').onclick = () => { selMonth = addMonths(todayStr().slice(0,7),-1); nav(); };

/* ============ KALENDER KUSTOM ============ */
const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MON_SHORT = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const ICO_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
const ICO_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
const ICO_D = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
let calMode = null;   // 'day' | 'month'
let cal = null;       // {y, m, sub:'days'|'months'}

function openCal(mode){
  calMode = mode;
  if(mode === 'day'){ const d = parse(selDate); cal = {y:d.getFullYear(), m:d.getMonth(), sub:'days'}; }
  else cal = {y:Number(selMonth.slice(0,4)), m:Number(selMonth.slice(5,7))-1, sub:'months'};
  drawCal();
  $('calOverlay').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeCal(){
  $('calOverlay').hidden = true;
  document.body.style.overflow = '';
  calMode = null;
}
function drawCal(){
  const t = todayStr(), ty = Number(t.slice(0,4)), tm = Number(t.slice(5,7)) - 1;
  let head, body, foot;

  if(calMode === 'day' && cal.sub === 'days'){
    const {y,m} = cal;
    const offset = (new Date(y,m,1).getDay() + 6) % 7;     // minggu mulai hari Senin
    const total = new Date(y,m+1,0).getDate();
    const atMax = (y > ty) || (y === ty && m >= tm);
    head = `<button class="cal-nav" data-act="prev" aria-label="Bulan sebelumnya">${ICO_L}</button>
      <button class="cal-title" data-act="title">${MONTHS[m]} ${y}${ICO_D}</button>
      <button class="cal-nav" data-act="next" aria-label="Bulan berikutnya" ${atMax?'disabled':''}>${ICO_R}</button>`;
    let cells = '';
    for(let i=0;i<offset;i++) cells += '<span class="cal-day blank"></span>';
    for(let d=1; d<=total; d++){
      const ds = `${y}-${pad(m+1)}-${pad(d)}`;
      const dow = (offset + d - 1) % 7;
      const o = DAYS[ds];
      const has = o && (o.lap.length || o.min.length || o.out.length);
      cells += `<button class="cal-day${dow===6?' sun':''}${ds===t?' today':''}${ds===selDate?' sel':''}${has?' has':''}" data-act="day" data-v="${ds}" ${ds>t?'disabled':''}>${d}</button>`;
    }
    body = `<div class="cal-week">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>`<span>${x}</span>`).join('')}</div>
      <div class="cal-days">${cells}</div>
      <div class="cal-legend"><i></i>ada transaksi</div>`;
    foot = `<button data-act="close">Tutup</button><button class="primary" data-act="today">Hari ini</button>`;
  } else {
    // pilih bulan (dipakai tab Bulanan, dan sebagai lompat-cepat di tab Harian)
    const y = cal.y;
    const selY = calMode === 'month' ? Number(selMonth.slice(0,4)) : cal.y;
    const selM = calMode === 'month' ? Number(selMonth.slice(5,7)) - 1 : cal.m;
    head = `<button class="cal-nav" data-act="yprev" aria-label="Tahun sebelumnya">${ICO_L}</button>
      <button class="cal-title static" disabled>${y}</button>
      <button class="cal-nav" data-act="ynext" aria-label="Tahun berikutnya" ${y>=ty?'disabled':''}>${ICO_R}</button>`;
    body = `<div class="cal-months">${MON_SHORT.map((n,i)=>{
      const dis = y > ty || (y === ty && i > tm);
      const isSel = (y === selY && i === selM);
      const isNow = (y === ty && i === tm);
      return `<button class="cal-mon${isSel?' sel':''}${isNow?' now':''}" data-act="mon" data-v="${i}" ${dis?'disabled':''}>${n}</button>`;
    }).join('')}</div>`;
    foot = calMode === 'month'
      ? `<button data-act="close">Tutup</button><button class="primary" data-act="thismonth">Bulan ini</button>`
      : `<button data-act="back">Kembali</button><button class="primary" data-act="thismonth">Bulan ini</button>`;
  }
  $('cal').innerHTML = `<div class="cal-head">${head}</div><div class="cal-body">${body}</div><div class="cal-foot">${foot}</div>`;
}
$('cal').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v;
  const t = todayStr();
  if(act === 'close') return closeCal();
  if(act === 'prev'){ cal.m--; if(cal.m < 0){ cal.m = 11; cal.y--; } return drawCal(); }
  if(act === 'next'){ cal.m++; if(cal.m > 11){ cal.m = 0; cal.y++; } return drawCal(); }
  if(act === 'yprev'){ cal.y--; return drawCal(); }
  if(act === 'ynext'){ cal.y++; return drawCal(); }
  if(act === 'title'){ cal.sub = 'months'; return drawCal(); }
  if(act === 'back'){ cal.sub = 'days'; return drawCal(); }
  if(act === 'day'){ selDate = v; closeCal(); return nav(); }
  if(act === 'today'){ selDate = t; closeCal(); return nav(); }
  if(act === 'thismonth'){
    if(calMode === 'month'){ selMonth = t.slice(0,7); closeCal(); return nav(); }
    cal.y = Number(t.slice(0,4)); cal.m = Number(t.slice(5,7)) - 1; cal.sub = 'days'; return drawCal();
  }
  if(act === 'mon'){
    if(calMode === 'month'){ selMonth = `${cal.y}-${pad(Number(v)+1)}`; closeCal(); return nav(); }
    cal.m = Number(v); cal.sub = 'days'; return drawCal();
  }
});
$('calOverlay').addEventListener('click', e => { if(e.target === $('calOverlay')) closeCal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && calMode) closeCal(); });
$('dOpen').onclick = () => openCal('day');
$('mOpen').onclick = () => openCal('month');

// ketuk baris tabel / batang grafik -> buka laporan harian tanggal itu
$('bulananBody').addEventListener('click', e => {
  const el = e.target.closest('[data-date]');
  if(!el) return;
  selDate = el.dataset.date;
  setView('harian');
});

/* ============ CSV BULANAN ============ */
$('mCsv').addEventListener('click', () => {
  if(!ready()) return;
  const {days, T} = monthData(selMonth);
  if(!days.length){ alert('Belum ada data untuk bulan ini.'); return; }
  const head = ['Tanggal','Sewa Lapangan','Minuman','Total Pemasukan','Cash','QRIS/TF','Pengeluaran','Hasil Bersih','Sisa Cash'];
  const line = (label, s) => [label, s.lap, s.min, s.masuk, s.cash, s.non, s.out, s.bersih, s.sisaCash];
  const data = [head, ...days.map(({d,s}) => line(d, s)), line('TOTAL', T)];
  const csv = data.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8;'}));
  a.download = `laporan-keuangan-${selMonth}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* ============ REALTIME ============ */
let buildTimer = null;
function scheduleBuild(){
  clearTimeout(buildTimer);
  buildTimer = setTimeout(() => {
    if(ready()){ buildIndex(); }
    render(!document.querySelector('#harianBody .hero, #bulananBody .hero'));
  }, 60);
}
NODES.forEach(n => {
  onValue(ref(db, n), snap => {
    DATA[n] = snap.val() || {};
    loaded.add(n);
    scheduleBuild();
  }, err => {
    console.error('[laporan] gagal membaca', n, err);
    loadError = err;
    scheduleBuild();
  });
});

render(false);
</script>
</body>
</html>
